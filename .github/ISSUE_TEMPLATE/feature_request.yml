name: "🚀 Feature request"
description: Suggest a new capability, provider, or improvement for tamash-playwright
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! The Language and Framework fields are used to auto-label and route your request.
        Before submitting, please search [existing issues](../../issues?q=is%3Aissue) to avoid duplicates.

  - type: dropdown
    id: language
    attributes:
      label: Language
      description: Which language binding is this request about? Pick "Other / not applicable" if it applies to all of them.
      options:
        - TypeScript
        - Python
        - Java
        - Other / not applicable
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Framework
      description: Which test framework is this request about?
      options:
        - Playwright Test (TypeScript)
        - pytest (Python)
        - JUnit 5 (Java)
        - TestNG (Java)
        - Other / not applicable
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do today that's hard, slow, or not possible?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? API sketch, config option, CLI flag, etc. are all welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or other approaches you considered.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
