name: Label issues by language and framework

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply language/framework labels from issue form
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            function extractField(sectionTitle) {
              const re = new RegExp(`### ${sectionTitle}\\s*\\n\\n([^\\n]+)`);
              const match = body.match(re);
              return match ? match[1].trim() : null;
            }

            const languageLabels = {
              "TypeScript": "lang: typescript",
              "Python": "lang: python",
              "Java": "lang: java",
            };

            const frameworkLabels = {
              "Playwright Test (TypeScript)": "framework: playwright-test",
              "pytest (Python)": "framework: pytest",
              "JUnit 5 (Java)": "framework: junit5",
              "TestNG (Java)": "framework: testng",
            };

            const labelColors = {
              "lang: typescript": "3178c6",
              "lang: python": "306998",
              "lang: java": "b07219",
              "framework: playwright-test": "2ead33",
              "framework: pytest": "0a9edc",
              "framework: junit5": "25a162",
              "framework: testng": "f2a20c",
            };

            const language = extractField("Language");
            const framework = extractField("Framework");

            const toApply = [];
            if (language && languageLabels[language]) toApply.push(languageLabels[language]);
            if (framework && frameworkLabels[framework]) toApply.push(frameworkLabels[framework]);

            if (toApply.length === 0) {
              console.log("No recognized Language/Framework answers found; nothing to label.");
              return;
            }

            for (const label of toApply) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: labelColors[label] || "ededed",
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: toApply,
            });
